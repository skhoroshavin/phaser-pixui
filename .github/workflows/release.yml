name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Bump type"
        required: true
        type: choice
        options: [patch, minor, major]
      title:
        description: "Release title"
        required: true
        type: string
      description:
        description: "Release description"
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Build library
        run: npm run build

      - name: Install example deps
        run: npm run example:install

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright and system deps
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps only
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run E2E tests
        run: npm test

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/
          retention-days: 7

      - name: Bump version
        run: npm version ${{ inputs.bump }} --no-git-tag-version

      - name: Regenerate screenshots
        run: npx playwright test --update-snapshots

      - name: Commit version bump and tag
        id: bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          TAG="v$(node -p "require('./package.json').version")"
          git add package.json package-lock.json e2e/screenshots
          git commit -m "Bump version to ${TAG#v}"
          git tag -a "$TAG" -m "$TAG"
          git push origin main --follow-tags
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Publish to NPM
        run: npm publish --provenance

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.bump.outputs.tag }}
          name: ${{ inputs.title }}
          body: ${{ inputs.description }}
          make_latest: true

      - name: Publish to itch.io
        uses: XanatosX/butler-publish-itchio-action@fb0a6f13954b75e8fbcfb703dbdb8626452efaba
        env:
          BUTLER_CREDENTIALS: ${{ secrets.BUTLER_API_KEY }}
          CHANNEL: web
          ITCH_GAME: phaser-pixui
          ITCH_USER: skhoroshavin
          PACKAGE: example/dist
          VERSION: ${{ steps.bump.outputs.tag }}
